name: Create GamePulse keystore

# Jalankan SEKALI. Hasilnya berupa artifact berisi kunci + nilai untuk GitHub Secrets.
# Setelah secrets diisi dan kunci DIPERIKSA TERSIMPAN AMAN di luar GitHub (mis. Google Drive pribadi),
# hapus artifact dan run ini dari tab Actions. Kunci hilang = aplikasi tidak bisa diperbarui.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore out/gamepulse-release.jks -storepass "$PASS" -keypass "$PASS" \
            -alias gamepulse -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GamePulse, O=Salamuda"
          {
            echo "Isi 4 secret ini di Settings > Secrets and variables > Actions:"
            echo
            echo "GP_KEYSTORE_PASSWORD = $PASS"
            echo "GP_KEY_ALIAS         = gamepulse"
            echo "GP_KEY_PASSWORD      = $PASS"
            echo "GP_KEYSTORE_BASE64   = (isi file gamepulse-release.jks.base64.txt)"
          } > out/SECRETS-README.txt
          base64 -w0 out/gamepulse-release.jks > out/gamepulse-release.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GamePulse-keystore-RAHASIA
          path: out/
          retention-days: 1
