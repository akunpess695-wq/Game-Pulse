name: Build GamePulse v1.0 Release

# Taruh di .github/workflows/build.yml
# Syarat: GamePulse-v1.0-source.zip ada di root branch main (diunggah sebagai ZIP, jangan diekstrak).
# Tanpa 4 secret GP_*, build tetap jalan dengan kunci sementara (APK bisa dipasang, tapi tidak bisa
# diperbarui oleh build bertanda tangan lain). Dengan secret lengkap, hasilnya bertanda tangan kunci tetap.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak sumber
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls GamePulse-v*-source.zip 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::GamePulse-v*-source.zip tidak ditemukan di root repo. Unggah zip-nya (jangan diekstrak)."
            exit 1
          fi
          echo "Memakai $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          DIR="$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle | head -1)")"
          test -f "$DIR/app/build.gradle" || { echo "::error::Struktur proyek tidak dikenali di dalam zip."; exit 1; }
          VN="$(grep -oP "versionName '\K[^']+" "$DIR/app/build.gradle")"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "Proyek: $DIR  versi: $VN"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci penandatanganan
        shell: bash
        env:
          S_B64: ${{ secrets.GP_KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.GP_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.GP_KEY_ALIAS }}
          S_KPASS: ${{ secrets.GP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/gamepulse-release.jks"
          if [ -n "$S_B64" ] && [ -n "$S_PASS" ] && [ -n "$S_ALIAS" ] && [ -n "$S_KPASS" ]; then
            echo "$S_B64" | base64 -d > "$JKS"
            keytool -list -keystore "$JKS" -storepass "$S_PASS" -alias "$S_ALIAS" >/dev/null \
              || { echo "::error::Kunci/sandi/alias di secrets tidak cocok. Periksa 4 secret GP_*."; exit 1; }
            PASS="$S_PASS"; ALIAS="$S_ALIAS"; KPASS="$S_KPASS"
            echo "Memakai kunci tetap dari secrets."
          else
            echo "::warning::Secrets GP_* belum lengkap. Memakai kunci SEMENTARA: APK ini tidak bisa diperbarui oleh build lain."
            PASS="$(openssl rand -hex 16)"; ALIAS="temp"; KPASS="$PASS"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$JKS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=GamePulse Temp, O=Salamuda"
          fi
          {
            echo "GP_KEYSTORE_PATH=$JKS"
            echo "GP_KEYSTORE_PASSWORD=$PASS"
            echo "GP_KEY_ALIAS=$ALIAS"
            echo "GP_KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Bangun APK + AAB rilis
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          gradle -p "$PROJ" :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Periksa hasil dan tanda tangan
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJ/app/build/outputs/apk/release/app-release.apk"
          AAB="$PROJ/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" || { echo "::error::APK rilis tidak terbentuk."; exit 1; }
          test -s "$AAB" || { echo "::error::AAB rilis tidak terbentuk."; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p dist
          cp "$APK" "dist/GamePulse-v$VN-release.apk"
          cp "$AAB" "dist/GamePulse-v$VN-release.aab"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v${{ env.VN }}-release-APK
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v${{ env.VN }}-release-AAB
          path: dist/*.aab
          if-no-files-found: error
