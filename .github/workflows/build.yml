name: Build GamePulse APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GamePulse-v0.4-dev-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP automatically on runner
        shell: bash
        run: |
          set -euo pipefail
          test -f GamePulse-v0.4-dev-source.zip
          mkdir -p "$RUNNER_TEMP/gamepulse"
          python3 - <<'PY'
          import pathlib, zipfile, os
          src = pathlib.Path('GamePulse-v0.4-dev-source.zip')
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamepulse'
          with zipfile.ZipFile(src) as z:
              for member in z.infolist():
                  target = (dest / member.filename).resolve()
                  if not target.is_relative_to(dest.resolve()):
                      raise ValueError('Unsafe ZIP path: ' + member.filename)
              z.extractall(dest)
          PY
          test -f "$RUNNER_TEMP/gamepulse/GamePulse-v0.3/settings.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/gamepulse/GamePulse-v0.3" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v0.4-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
