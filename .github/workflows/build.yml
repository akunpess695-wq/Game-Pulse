name: Build GamePulse v0.2 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GamePulse-v0.2-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP safely on runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, zipfile
          source = pathlib.Path('GamePulse-v0.2-source.zip')
          if not source.is_file(): raise SystemExit('Missing GamePulse-v0.2-source.zip at repository root')
          dest = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamepulse-src').resolve()
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              bad = z.testzip()
              if bad: raise SystemExit('Corrupt ZIP member: ' + bad)
              for entry in z.infolist():
                  target = (dest / entry.filename).resolve()
                  if not target.is_relative_to(dest): raise SystemExit('Unsafe ZIP path: ' + entry.filename)
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000: raise SystemExit('Symlink not allowed')
              z.extractall(dest)
          project = dest / 'GamePulse-v0.2'
          if not (project / 'settings.gradle').is_file(): raise SystemExit('Missing settings.gradle in ZIP')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('PROJECT_DIR=' + str(project) + '\n')
          print('Project:', project)
          PY

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            test -n "$SDKMANAGER" || { echo 'sdkmanager not found'; exit 1; }
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v0.2-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
