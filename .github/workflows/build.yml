name: Build GamePulse v1.0 Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GamePulse-v1.0-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  GP_KEYSTORE_PASSWORD: ${{ secrets.GP_KEYSTORE_PASSWORD }}
  GP_KEY_ALIAS: ${{ secrets.GP_KEY_ALIAS }}
  GP_KEY_PASSWORD: ${{ secrets.GP_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract GamePulse ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive = pathlib.Path('GamePulse-v1.0-source.zip')
          if not archive.is_file():
              raise SystemExit('Missing GamePulse-v1.0-source.zip in repository root (main branch).')
          destination = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamepulse-project').resolve()
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise SystemExit('Corrupt ZIP entry: ' + bad)
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if not target.is_relative_to(destination): raise SystemExit('Unsafe ZIP path: ' + item.filename)
                  if stat.S_ISLNK(item.external_attr >> 16): raise SystemExit('Symlink rejected: ' + item.filename)
              z.extractall(destination)
          project = destination / 'GamePulse-v1.0'
          if not (project / 'settings.gradle').is_file(): raise SystemExit('Missing GamePulse-v1.0/settings.gradle')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('PROJECT_DIR=' + str(project) + '\n')
          print('Extracted project:', project)
          PY

      - name: Prepare signing key
        shell: bash
        env:
          GP_KEYSTORE_BASE64: ${{ secrets.GP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/gamepulse-release.jks"
          if [ -n "${GP_KEYSTORE_BASE64:-}" ]; then
            echo "$GP_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Memakai kunci rilis dari GitHub Secrets."
          else
            echo "::warning::Secret GP_KEYSTORE_BASE64 belum diisi. Memakai kunci SEMENTARA: APK ini tidak bisa menimpa/diperbarui oleh build berikutnya yang memakai kunci lain. Jalankan workflow 'Create GamePulse keystore' lalu isi secrets untuk rilis resmi."
            keytool -genkeypair -keystore "$KS" -storepass gamepulse-temp -keypass gamepulse-temp \
              -alias gamepulse -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GamePulse Temporary"
            echo "GP_KEYSTORE_PASSWORD=gamepulse-temp" >> "$GITHUB_ENV"
            echo "GP_KEY_PASSWORD=gamepulse-temp" >> "$GITHUB_ENV"
            echo "GP_KEY_ALIAS=gamepulse" >> "$GITHUB_ENV"
          fi
          echo "GP_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Prepare runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            test -n "$SDKMANAGER" || { echo 'Android sdkmanager not found'; exit 1; }
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK and AAB
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          ls -l "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v1.0.0-release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v1.0.0-release-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
