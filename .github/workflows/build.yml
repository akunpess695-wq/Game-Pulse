name: Build GamePulse v0.3 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GamePulse-v0.3-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract GamePulse ZIP automatically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive = pathlib.Path('GamePulse-v0.3-source.zip')
          if not archive.is_file():
              raise SystemExit('Missing GamePulse-v0.3-source.zip in repository root (Code tab, main branch). Upload the SOURCE ZIP, not the workflow TXT/ZIP.')
          destination = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamepulse-project').resolve()
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise SystemExit('Corrupt ZIP entry: '+bad)
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if not target.is_relative_to(destination): raise SystemExit('Unsafe ZIP path: '+item.filename)
                  if stat.S_ISLNK(item.external_attr >> 16): raise SystemExit('Symlink rejected: '+item.filename)
              z.extractall(destination)
          project = destination / 'GamePulse-v0.3'
          if not (project / 'settings.gradle').is_file(): raise SystemExit('Missing GamePulse-v0.3/settings.gradle')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('PROJECT_DIR='+str(project)+'\n')
          print('Extracted project:',project)
          PY
      - name: Prepare runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            test -n "$SDKMANAGER" || { echo 'Android sdkmanager not found'; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v0.3-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
