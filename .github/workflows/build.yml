name: Build GamePulse APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GamePulse-v0.1-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK path: $SDK"
          ls -la "$SDK" || true
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$SDKMANAGER" ]; then
              echo 'Android SDK manager unavailable on runner'; exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          test -f GamePulse-v0.1-source.zip
          mkdir -p "$RUNNER_TEMP/gamepulse"
          python3 - <<'PY'
          import os, pathlib, zipfile
          dest = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamepulse').resolve()
          with zipfile.ZipFile('GamePulse-v0.1-source.zip') as z:
              for entry in z.infolist():
                  path = (dest / entry.filename).resolve()
                  if not path.is_relative_to(dest):
                      raise ValueError('Unsafe ZIP path: ' + entry.filename)
              z.extractall(dest)
          PY
          PROJECT_DIR="$RUNNER_TEMP/gamepulse/GamePulse-v0.1"
          test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GamePulse-v0.1-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
